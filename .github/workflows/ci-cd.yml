name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/*, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  static-analysis-and-lint:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Android Lint & Static Analysis
        run: ./gradlew lintDebug

  unit-and-performance-tests:
    name: Unit, Robolectric & Benchmark Tests
    needs: static-analysis-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Execute Unit & Scalability Tests
        run: ./gradlew testDebugUnitTest

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  security-and-dependency-scan:
    name: Security Vulnerability & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Dependency Vulnerability Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SmartBiz Enterprise'
          path: '.'
          format: 'HTML'

  docker-build-and-push:
    name: Multi-Stage Docker Container Build
    needs: [unit-and-performance-tests, security-and-dependency-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Enterprise Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/smartbiz/enterprise-platform:latest
            ghcr.io/smartbiz/enterprise-platform:${{ github.sha }}

  kubernetes-zero-downtime-deploy:
    name: Kubernetes Rolling Blue/Green Deployment
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Deploy to K8s Production Cluster
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          kubectl apply -f k8s/configmap-secrets.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/smartbiz-api-deployment -n production --timeout=300s
